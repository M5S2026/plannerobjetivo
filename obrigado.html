<style>
/* Mesmo caderno botânico da página de vendas: folhas creme, faixas sálvia */
:root {
  --paper: #FBF7EF;
  --sheet: #FFFFFF;
  --ink: #2F4A3F;
  --text: #3E4A44;
  --muted: #7E877F;
  --sage: #7A9A81;
  --sage-l: #E3EBE2;
  --peach: #F8E6DA;
  --pink: #F6E0E2;
  --lav: #E9E5F1;
  --gold: #B98F57;
  --line: #E4DCCD;
  --f-script: "Great Vibes", "Snell Roundhand", cursive;
  --f-serif: "Cormorant Garamond", Georgia, serif;
  --f-sans: "Lato", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--paper); color: var(--text); }
body { margin: 0; font-family: var(--f-sans); font-size: 17px; line-height: 1.6; }
:lang(ja) body, body:lang(ja) { font-family: "Zen Kaku Gothic New", var(--f-sans); }
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; }
h1, h2, h3 { color: var(--ink); margin: 0; font-weight: 600; text-wrap: balance; }
p { margin: 0; }
.top { display: flex; justify-content: flex-end; padding-top: 16px; position: relative; z-index: 2; }
.langs { display: flex; gap: 6px; flex-wrap: wrap; }
.langs button { font: 700 14px var(--f-sans); color: var(--ink); background: var(--sage-l); border: 0; border-radius: 999px; padding: 7px 14px; cursor: pointer; }
.langs button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.langs button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.hero { position: relative; overflow: hidden; padding-block: 28px 40px; }
.hero .deco { position: absolute; right: -40px; top: -40px; width: min(240px, 50vw); opacity: .9; pointer-events: none; }
.hero h1 { font-family: var(--f-script); font-weight: 400; font-size: clamp(54px, 12vw, 84px); line-height: 1; position: relative; }
:lang(ja) .hero h1 { font-family: "Zen Kaku Gothic New", var(--f-sans); font-weight: 700; font-size: clamp(32px, 7vw, 44px); }
.hero .lead { font-family: var(--f-serif); font-size: 23px; line-height: 1.35; margin-top: 14px; max-width: 34ch; position: relative; }
:lang(ja) .hero .lead { font-family: inherit; font-size: 18px; }
section { padding-block: 28px; }
h2 { font-family: var(--f-serif); font-size: clamp(28px, 6vw, 36px); line-height: 1.15; margin-bottom: 18px; }
:lang(ja) h2 { font-family: inherit; font-size: 24px; }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.card { border-radius: 18px; padding: 22px; display: grid; gap: 8px; align-content: start; }
.card h3 { font-family: var(--f-serif); font-size: 23px; line-height: 1.2; }
:lang(ja) .card h3 { font-family: inherit; font-size: 19px; }
.card.a { background: var(--sage-l); } .card.b { background: var(--peach); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; counter-reset: s; }
.steps li { background: var(--sheet); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px 16px 62px; position: relative; counter-increment: s; }
.steps li::before { content: counter(s); position: absolute; left: 18px; top: 14px; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--sage); color: #fff; font-weight: 700; }
.warn { margin-top: 14px; background: var(--pink); border-radius: 16px; padding: 16px 18px; }
.warn strong { color: var(--ink); }
.ticks { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.ticks li { position: relative; padding-left: 36px; }
.ticks li::before { content: "✓"; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--sage); color: #fff; font-size: 14px; font-weight: 700; position: absolute; left: 0; top: 2px; }
.btnname { font-weight: 700; color: var(--ink); background: var(--lav); border-radius: 6px; padding: 1px 6px; white-space: nowrap; }
code { font-family: ui-monospace, Menlo, monospace; font-size: .9em; background: var(--sage-l); border-radius: 5px; padding: 1px 5px; }
.note { background: var(--sheet); border: 1px solid var(--line); border-radius: 18px; padding: 22px; display: grid; gap: 10px; text-align: center; }
.note .heart { font-family: var(--f-script); font-size: 40px; color: var(--ink); line-height: 1; }
:lang(ja) .note .heart { font-family: inherit; font-size: 22px; font-weight: 700; }
footer { padding-block: 28px 44px; font-size: 13.5px; color: var(--muted); text-align: center; }
[hidden] { display: none !important; }
@media (max-width: 600px) { .two { grid-template-columns: minmax(0, 1fr); } }
</style>

const HTML_LANG = { pt: "pt-BR", en: "en", es: "es", ja: "ja" };
function pick() {
  const q = new URLSearchParams(location.search).get("lang");
  if (q && T[q]) return q;
  const n = (navigator.language || "pt").slice(0, 2).toLowerCase();
  return T[n] ? n : "pt";
}
function setLang(l) {
  const t = T[l];
  document.documentElement.lang = HTML_LANG[l];
  document.title = t.title;
  document.querySelectorAll("[data-t]").forEach(el => { el.innerHTML = t[el.dataset.t]; });
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.l === l)));
}
document.querySelector(".langs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) setLang(b.dataset.l); });
setLang(pick());
</script>
